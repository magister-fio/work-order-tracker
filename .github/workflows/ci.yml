name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start SQL Server
        run: |
          docker run \
            --name workorder-sql \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=WorkOrder123!" \
            -p 1433:1433 \
            -d mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if docker exec workorder-sql \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "WorkOrder123!" \
              -C \
              -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi

            echo "Waiting for SQL Server..."
            sleep 2
          done

          echo "SQL Server failed to start"
          docker logs workorder-sql
          exit 1

      - name: Create database
        run: |
          docker exec workorder-sql \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "WorkOrder123!" \
            -C \
            -Q "CREATE DATABASE workorder"

      - name: Build and test backend
        run: mvn clean verify

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build